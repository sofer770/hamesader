name: Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk hamesader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hamesader-apk
          path: hamesader.apk
      # A permanent download link: github.com/sofer770/hamesader/releases/latest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hamesader.apk --title "המסדר - גרסה לאנדרואיד" --notes "להורדה: לחצו על hamesader.apk, פתחו את הקובץ בטלפון ואשרו התקנה."


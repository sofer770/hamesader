<!doctype html>
<html lang="he" dir="rtl">

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Open Graph: the logo card appears when the link is shared on WhatsApp / Facebook. Set VITE_SITE_URL in .env to the live domain (WhatsApp needs an absolute URL). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="המסדר" />
    <meta property="og:title" content="המסדר - כל מה ששמרת לעצמך, במקום אחד" />

    <meta property="og:image" content="%VITE_SITE_URL%/og-image-square.jpg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image-square.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet" />
